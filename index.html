<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/styles.css">
  
  <title>Tip calculator app</title>

</head>
<body>
  
      <div class="wrapper">
        <header>
          <img src="./images/logo.svg" alt="logo" class="logo">
        </header>
        
        <main>
        <div class="main-wrapper">
          <div class="form-container">
            <div class="form-box">
              <div class="input-container">
                <form action="" id="form">
                  <div class="input-wrapper" style="grid-area: box1">
                    <label class="heading bill-label" for="bill">Bill<span class="bill-input-error">Input Numbers Only</span></label>
                    <img class="icon-dollar" src="./images/icon-dollar.svg" alt="">
                    <input class="no-spinner" type="number" name="bill" id="bill" placeholder="0">
                  </div>
                </form>
                <section class="tip-selection" style="grid-area: box2">
                  <h2 class="heading">Select Tip %</h2>
                  <div class="tip-button-container">
                    <button class="tip-button five" data-option="five">5%</button>
                    <button class="tip-button ten" data-option="ten">10%</button>
                    <button class="tip-button fifteen" data-option="fifteen">15%</button>
                    <button class="tip-button twenty-five" data-option="twenty-five">25%</button>
                    <button class="tip-button fifty" data-option="fifty">50%</button>
                    <button class="tip-button custom" data-option="custom">Custom</button>
                  </div>
                </section>
                <form action="" id="form">
                  <div style="grid-area: box3">
                    <div class="input-wrapper">
                      <label class="heading" for="people">Number of People<span class="number-of-people-error">Can't be zero</span></label>
                      <img class="icon-person" src="./images/icon-person.svg" alt="">
                      <input class="no-spinner num-of-people-input-box" type="number" name="people" id="people" placeholder="0">
                    </div>
                  </div>
                </form>
              </div>
            </div>
            <section class="tip-card-container" style="grid-area: box4">
              <div class="calculations">
                <p>
                  <div class="calculations__flexbox">
                    <div class="calculations__text-flexbox">
                      Tip Amount
                      <span>/ person</span>
                    </div>
                    <text class="calculations__amounts tip">$0.00</text>
                  </div>
                </p>
              </div>
              <div class="calculations">
                <p>
                  <div class="calculations__flexbox">
                    <div class="calculations__text-flexbox">
                      Total
                      <span>/ person</span>
                    </div>
                    <text class="calculations__amounts total">$0.00</text>
                  </div>
                </p>
              </div>
              <button class="calculations__reset-button" id="reset">Reset</button>
            </section>
          </div>
        </div>
        </main>
      </div>
  
  <script src="./dist/script.js"></script>
</body>
</html>
